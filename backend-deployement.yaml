apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: kiurow590/back:v1.0
          ports:
            - containerPort: 5000  # Par exemple, si c'est une API Node.js